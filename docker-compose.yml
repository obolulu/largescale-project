services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billing_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-billing}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billing} -d ${POSTGRES_DB:-billing}"]
      interval: 5s
      timeout: 3s
      retries: 10

  billing-api:
    build: ./billing-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-billing}:${POSTGRES_PASSWORD:-billing_dev_password}@db:5432/${POSTGRES_DB:-billing}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-in-cloud-0001}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  mcp-server:
    build: ./mcp-server
    ports:
      - "8001:8001"

volumes:
  pgdata:
