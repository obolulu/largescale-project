openapi: 3.0.0
paths:
  /api/v1/health:
    get:
      operationId: health
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      summary: Health
      tags:
        - meta
  /api/v1/auth/login:
    post:
      description: 'Exchange username and password for a JWT. Send it as `Authorization: Bearer <token>`.'
      operationId: login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed or business rule violated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Login
      tags:
        - auth
  /api/v1/usage:
    post:
      description: |-
        **Add Usage** (admin). Records one event: 10 minutes for PHONE, 1 MB for INTERNET.

        Usage is not billed until Calculate Bill runs for that period again.
      operationId: addUsage
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUsageRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddUsageResponse'
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (wrong role or another subscriber's data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscriber or bill not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed or business rule violated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - HTTPBearer: []
      summary: Add Usage
      tags:
        - usage
  /api/v1/bills:
    get:
      description: >-
        **Query Bill** (no authentication, per the spec). Total, paid amount, remaining balance,
        status.
      operationId: queryBill
      parameters:
        - name: subscriber_no
          required: true
          in: query
          schema:
            minLength: 1
            maxLength: 20
            example: '5551001'
            type: string
        - name: month
          required: true
          in: query
          schema:
            minimum: 1
            maximum: 12
            example: 10
            type: integer
        - name: year
          required: true
          in: query
          schema:
            minimum: 2000
            maximum: 2100
            example: 2026
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillSummary'
        '404':
          description: Subscriber or bill not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed or business rule violated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Query Bill
      tags:
        - bills
  /api/v1/bills/detailed:
    get:
      description: >-
        **Query Bill Detailed** (authenticated, paged). Usage totals, charge breakdown and a page of
        usage records.
      operationId: queryBillDetailed
      parameters:
        - name: month
          required: true
          in: query
          schema:
            minimum: 1
            maximum: 12
            example: 10
            type: integer
        - name: year
          required: true
          in: query
          schema:
            minimum: 2000
            maximum: 2100
            example: 2026
            type: integer
        - name: subscriber_no
          required: false
          in: query
          description: Optional for subscribers (must match the token); required for admins.
          schema:
            maxLength: 20
            type: string
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: integer
        - name: page_size
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillDetailed'
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (wrong role or another subscriber's data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscriber or bill not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed or business rule violated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - HTTPBearer: []
      summary: Query Bill Detailed
      tags:
        - bills
  /api/v1/bills/calculate:
    post:
      description: >-
        **Calculate Bill** (admin). Computes the bill from recorded usage and stores it.


        Running it again for the same period updates the charges and keeps any payments already
        made.
      operationId: calculateBill
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateBillRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateBillResponse'
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (wrong role or another subscriber's data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscriber or bill not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed or business rule violated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - HTTPBearer: []
      summary: Calculate Bill
      tags:
        - bills
  /api/v1/payments:
    post:
      description: >-
        **Pay Bill** (authenticated). Records a simulated full or partial payment. No card
        processing.


        `transaction_id` is the idempotency key: a repeated ID returns 409 and records nothing.

        Amounts above the remaining balance are rejected.
      operationId: payBill
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayBillRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayBillResponse'
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not allowed (wrong role or another subscriber's data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscriber or bill not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate transaction ID, or bill already paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed or business rule violated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - HTTPBearer: []
      summary: Pay Bill
      tags:
        - payments
info:
  title: Mobile Provider Billing API
  description: >-
    SE4458 midterm billing service. All routes are versioned under `/api/v1`.


    Protected routes need `Authorization: Bearer <JWT>` from `POST /api/v1/auth/login`. Subscribers
    can only act on the subscriber number in their own token.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: JWT from POST /api/v1/auth/login
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: v1
      required:
        - status
        - version
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          example: UNAUTHORIZED
        message:
          type: string
          example: Missing or invalid bearer token.
        details:
          type: object
          description: Field errors or extra context, when there are any.
      required:
        - code
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
        - error
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          example: sub5551001
        password:
          type: string
          example: sub1001-demo-pass
      required:
        - username
        - password
    Role:
      type: string
      enum:
        - SUBSCRIBER
        - ADMIN
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - bearer
          example: bearer
        expires_in:
          type: integer
          example: 3600
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
        subscriber_no:
          type: string
          nullable: true
          example: '5551001'
      required:
        - access_token
        - token_type
        - expires_in
        - role
        - subscriber_no
    UsageType:
      type: string
      enum:
        - PHONE
        - INTERNET
    AddUsageRequest:
      type: object
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
          example: 10
        year:
          type: integer
          minimum: 2000
          maximum: 2100
          example: 2026
        subscriber_no:
          type: string
          minLength: 1
          maxLength: 20
          example: '5551001'
        usage_type:
          allOf:
            - $ref: '#/components/schemas/UsageType'
      required:
        - month
        - year
        - subscriber_no
        - usage_type
    AddUsageResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - SUCCESS
        usage_id:
          type: integer
        subscriber_no:
          type: string
        month:
          type: integer
        year:
          type: integer
        usage_type:
          allOf:
            - $ref: '#/components/schemas/UsageType'
        amount_added:
          type: integer
        unit:
          type: string
          enum:
            - MINUTES
            - MB
      required:
        - status
        - usage_id
        - subscriber_no
        - month
        - year
        - usage_type
        - amount_added
        - unit
    BillStatus:
      type: string
      enum:
        - UNPAID
        - PARTIAL
        - PAID
    BillSummary:
      type: object
      properties:
        subscriber_no:
          type: string
        month:
          type: integer
        year:
          type: integer
        currency:
          type: string
          enum:
            - USD
        total:
          type: number
          example: 80
        paid_amount:
          type: number
          example: 30
        remaining_balance:
          type: number
          example: 50
        status:
          allOf:
            - $ref: '#/components/schemas/BillStatus'
        due_date:
          type: string
          format: date
          example: '2026-11-15'
      required:
        - subscriber_no
        - month
        - year
        - currency
        - total
        - paid_amount
        - remaining_balance
        - status
        - due_date
    UsageTotals:
      type: object
      properties:
        phone_minutes:
          type: integer
        internet_mb:
          type: integer
        internet_gb:
          type: number
      required:
        - phone_minutes
        - internet_mb
        - internet_gb
    PhoneChargeDetail:
      type: object
      properties:
        included_minutes:
          type: integer
        extra_minutes:
          type: integer
        block_minutes:
          type: integer
        blocks_charged:
          type: integer
        price_per_block:
          type: number
        charge:
          type: number
      required:
        - included_minutes
        - extra_minutes
        - block_minutes
        - blocks_charged
        - price_per_block
        - charge
    InternetChargeDetail:
      type: object
      properties:
        base_price:
          type: number
        included_gb:
          type: integer
        extra_mb:
          type: integer
        block_gb:
          type: integer
        blocks_charged:
          type: integer
        price_per_block:
          type: number
        charge:
          type: number
      required:
        - base_price
        - included_gb
        - extra_mb
        - block_gb
        - blocks_charged
        - price_per_block
        - charge
    ChargeBreakdown:
      type: object
      properties:
        phone:
          $ref: '#/components/schemas/PhoneChargeDetail'
        internet:
          $ref: '#/components/schemas/InternetChargeDetail'
        taxes_and_fees:
          type: number
          example: 0
      required:
        - phone
        - internet
        - taxes_and_fees
    UsageItem:
      type: object
      properties:
        id:
          type: integer
        usage_type:
          allOf:
            - $ref: '#/components/schemas/UsageType'
        amount:
          type: integer
        unit:
          type: string
          enum:
            - MINUTES
            - MB
        recorded_at:
          type: string
          format: date-time
      required:
        - id
        - usage_type
        - amount
        - unit
        - recorded_at
    UsageItemsPage:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/UsageItem'
      required:
        - page
        - page_size
        - total_items
        - total_pages
        - items
    BillDetailed:
      type: object
      properties:
        subscriber_no:
          type: string
        month:
          type: integer
        year:
          type: integer
        currency:
          type: string
          enum:
            - USD
        total:
          type: number
          example: 80
        paid_amount:
          type: number
          example: 30
        remaining_balance:
          type: number
          example: 50
        status:
          allOf:
            - $ref: '#/components/schemas/BillStatus'
        due_date:
          type: string
          format: date
          example: '2026-11-15'
        calculated_at:
          type: string
          format: date-time
        usage:
          $ref: '#/components/schemas/UsageTotals'
        charges:
          $ref: '#/components/schemas/ChargeBreakdown'
        usage_items:
          $ref: '#/components/schemas/UsageItemsPage'
      required:
        - subscriber_no
        - month
        - year
        - currency
        - total
        - paid_amount
        - remaining_balance
        - status
        - due_date
        - calculated_at
        - usage
        - charges
        - usage_items
    CalculateBillRequest:
      type: object
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
          example: 10
        year:
          type: integer
          minimum: 2000
          maximum: 2100
          example: 2026
        subscriber_no:
          type: string
          minLength: 1
          maxLength: 20
          example: '5551001'
      required:
        - month
        - year
        - subscriber_no
    CalculateBillResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - SUCCESS
        action:
          type: string
          enum:
            - CREATED
            - UPDATED
        bill:
          $ref: '#/components/schemas/BillSummary'
        phone_minutes:
          type: integer
        internet_mb:
          type: integer
        phone_charge:
          type: number
        internet_charge:
          type: number
      required:
        - status
        - action
        - bill
        - phone_minutes
        - internet_mb
        - phone_charge
        - internet_charge
    PayBillRequest:
      type: object
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
          example: 10
        year:
          type: integer
          minimum: 2000
          maximum: 2100
          example: 2026
        subscriber_no:
          type: string
          minLength: 1
          maxLength: 20
          description: Optional for subscribers (taken from the token); required for admins.
          example: '5551001'
          nullable: true
        amount:
          oneOf:
            - type: number
              exclusiveMinimum: true
              minimum: 0
            - type: string
          example: 30
        transaction_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_.:-]+$
          description: Client-generated idempotency key. Reusing one returns 409.
          example: 3f6c2a9e-0b1d-4c55-9a51-2f1b8f0c7d10
      required:
        - month
        - year
        - amount
        - transaction_id
    PayBillResponse:
      type: object
      properties:
        payment_status:
          type: string
          enum:
            - SUCCESS
        transaction_id:
          type: string
        amount:
          type: number
          example: 30
        paid_amount:
          type: number
          example: 30
        remaining_balance:
          type: number
          example: 50
        bill_status:
          allOf:
            - $ref: '#/components/schemas/BillStatus'
        bill:
          $ref: '#/components/schemas/BillSummary'
      required:
        - payment_status
        - transaction_id
        - amount
        - paid_amount
        - remaining_balance
        - bill_status
        - bill
